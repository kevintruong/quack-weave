name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  checks:
    if: github.event_name != 'push'
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features rusty_quack/template-compat

      - name: Build
        run: cargo build --workspace --locked --no-default-features --features rusty_quack/template-compat

      - name: Test
        run: cargo test --workspace --locked --no-default-features --features rusty_quack/template-compat

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: plan
        shell: bash
        run: |
          matrix=$(python3 benchmarks/provider_comparison/tracker/ci.py plan --manifest "$RUNNER_TEMP/commits.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          runner=ubuntu-24.04-arm
          while read -r sha; do
            if ! git grep -q aarch64-unknown-linux-gnu "$sha" -- Makefile; then runner=macos-15; break; fi
          done < <(jq -r '.[]' "$RUNNER_TEMP/commits.json")
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: qw-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commits.json
          if-no-files-found: error
          retention-days: 30
      - run: python3 -B -m unittest discover -s benchmarks/provider_comparison/tracker -p 'test_*.py'

  native:
    name: Prepare native CI artifacts
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 150
    outputs:
      host: ${{ steps.host-upload.outputs.artifact-id }}
      native: ${{ steps.native-upload.outputs.artifact-id }}
    env:
      CC: clang
      CXX: clang++
      RUSTC_WRAPPER: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native-setup
      - uses: actions/cache@v4
        with:
          path: build/duckdb-upstream
          key: duckdb-release-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/provider_comparison/tracker/install_host.py') }}
      - name: Install official DuckDB ADBC library and SQLLogic runner
        env:
          GH_TOKEN: ${{ github.token }}
          QW_DUCKDB_BUILD_MIRROR: ${{ vars.QW_DUCKDB_BUILD_MIRROR }}
        run: python3 benchmarks/provider_comparison/tracker/install_host.py
      - name: Publish pinned DuckDB host
        id: host-upload
        uses: actions/upload-artifact@v4
        with:
          name: qw-duckdb-host-${{ github.run_attempt }}
          path: build/benchmark-host/
          if-no-files-found: error
          retention-days: 30
      - name: Build the native release and RelateDB integration fixture builder
        if: github.event_name != 'workflow_dispatch'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          subject=$PWD
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_HEAD" ]]; then
            subject="$RUNNER_TEMP/graph-source"
            git worktree add --quiet --detach "$subject" "$SOURCE_HEAD"
            mkdir -p "$subject/build"
            ln -s "$PWD/build/deps" "$subject/build/deps"
            env -u MACOSX_DEPLOYMENT_TARGET make -C "$subject" native-deps
          fi
          env -u MACOSX_DEPLOYMENT_TARGET make -C "$subject" native-release
          python3 benchmarks/provider_comparison/tracker/artifacts.py stage "$subject" build/native/releases
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            target="$subject/target/native"
            env -u MACOSX_DEPLOYMENT_TARGET cargo build --manifest-path "$subject/Cargo.toml" \
              --locked -p rusty_quack --target "$QW_RUST_TARGET" --release \
              --target-dir "$target" --example relate_fixture
            mkdir -p build/native/clients
            cp "$target/$QW_RUST_TARGET/release/examples/relate_fixture" build/native/clients/
          fi
          echo "$(rustc --version) / $("$CXX" --version | head -n 1)" > build/native/toolchain.txt
      - name: Publish source release and integration fixture builder
        if: github.event_name != 'workflow_dispatch'
        id: native-upload
        uses: actions/upload-artifact@v4
        with:
          name: qw-native-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/native/releases/
            build/native/clients/
            build/native/toolchain.txt
          if-no-files-found: error
          retention-days: 30

  profiles:
    if: github.event_name != 'push'
    name: Build native stabilization packages
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 90
    outputs:
      packages: ${{ steps.profile-upload.outputs.artifact-id }}
    env:
      CC: clang
      CXX: clang++
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
      - name: Build native stabilization packages at the CI checkout
        run: env -u MACOSX_DEPLOYMENT_TARGET make native native-release
      - name: Build the observer test executables
        shell: bash
        run: |
          env -u MACOSX_DEPLOYMENT_TARGET cargo test --locked --no-run --lib -p rusty_quack -p rusty_quack_core \
            --target "$QW_RUST_TARGET" --target-dir target/native \
            --message-format=json > "$RUNNER_TEMP/observer-build.jsonl"
          mkdir -p build/observer-tests
          for crate in rusty_quack rusty_quack_core; do
            executable=$(jq -ser --arg crate "$crate" '
              [.[] | select(.reason == "compiler-artifact" and .profile.test and .target.name == $crate) | .executable]
              | if length == 1 then .[0] else error("expected one observer test executable") end
            ' "$RUNNER_TEMP/observer-build.jsonl")
            cp "$executable" "build/observer-tests/$crate"
          done
      - name: Publish native packages with their licenses
        id: profile-upload
        uses: actions/upload-artifact@v4
        with:
          name: qw-profiles-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/observer-tests/
            build/native/debug/extension/quack_weave/
            build/native/release/extension/quack_weave/
          if-no-files-found: error
          retention-days: 30

  stabilization:
    if: github.event_name != 'push'
    needs: [plan, native, profiles]
    name: Native stabilization
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare pinned Ladybug fixture CLI
        run: |
          directory="$RUNNER_TEMP/ladybug-0.22.3-cli"
          if [[ "$RUNNER_OS" == Linux ]]; then
            asset=lbug_cli-linux-aarch64.tar.gz
            digest=31f90d7da53245ab1a3b533df8d02939e5fdb60f517855a44c3ac8cd0969fbcd
          else
            asset=lbug_cli-osx-arm64.tar.gz
            digest=d0012ffc8683a7b88fe47b8068bf4ee12c5a7f5b5c08fde89a2e4a6acd091a90
          fi
          archive="$directory/$asset"
          mkdir -p "$directory"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/LadybugDB/ladybug/releases/download/v0.22.3/$asset"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$directory"
          test "$("$directory/lbug" -v)" = 'Lbug 0.22.3'
          printf 'LBUG=%s\n' "$directory/lbug" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.native.outputs.host }}
          merge-multiple: true
          path: build/benchmark-host
      - name: Prepare the shared DuckDB runtime
        run: |
          bash benchmarks/provider_comparison/tracker/activate_host.sh

      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.profiles.outputs.packages }}
          merge-multiple: true
          path: build
      - name: Verify the native packages and observations
        run: |
          chmod +x build/observer-tests/{rusty_quack,rusty_quack_core}
          make native-stabilization-test-prebuilt OBSERVER_TEST_DIR="$PWD/build/observer-tests"

      - name: Verify public graph results through Apache Arrow ADBC
        run: |
          python3 -m venv "$RUNNER_TEMP/graph-client"
          "$RUNNER_TEMP/graph-client/bin/pip" install --only-binary=:all: --require-hashes \
            -r benchmarks/provider_comparison/tracker/requirements.txt
          make public-client-test-prebuilt PYTHON_BIN="$RUNNER_TEMP/graph-client/bin/python"

      - uses: actions/download-artifact@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          artifact-ids: ${{ needs.native.outputs.native }}
          merge-multiple: true
          path: build/native
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: provider-source
      - name: Run provider integration on the release supplied to the benchmark
        if: github.event_name != 'workflow_dispatch'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          release="$PWD/build/native/releases/$SOURCE_HEAD"
          python benchmarks/provider_comparison/tracker/artifacts.py verify "$release" "$SOURCE_HEAD"
          chmod +x build/native/clients/relate_fixture
          python provider-source/test/relate/run.py --duckdb-unittest "$DUCKDB_UNITTEST" --lbug "$LBUG" \
            --fixture-builder build/native/clients/relate_fixture --extension "$release/quack_weave.duckdb_extension"

      - name: Save stabilization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quackweave-stabilization-${{ github.run_attempt }}
          path: build/stabilization-reports/
          if-no-files-found: warn

  benchmark:
    if: github.event_name != 'workflow_dispatch'
    needs: [plan, native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/Benchmark.yml
    with:
      commits: ${{ matrix.commits }}
      shard: ${{ matrix.index }}
      runner: ${{ needs.plan.outputs.runner }}
      source-head: ${{ github.event.pull_request.head.sha || github.sha }}
      host-artifact: ${{ needs.native.outputs.host }}
      native-artifact: ${{ needs.native.outputs.native }}

  gate:
    name: Benchmark tracker gate
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [plan, native, benchmark]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.native.result }}
          MEASURE: ${{ needs.benchmark.result }}
        run: test "$PLAN" = success && test "$BUILD" = success && test "$MEASURE" = success
