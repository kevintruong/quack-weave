name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features rusty_quack/template-compat

      - name: Build
        run: cargo build --workspace --locked --features rusty_quack/template-compat

      - name: Test
        run: cargo test --workspace --locked --features rusty_quack/template-compat

  stabilization:
    name: Native stabilization (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare native dependencies
        run: |
          test "$(uname -s):$(uname -m)" = "Darwin:arm64"
          if ! brew list --versions openssl@3 >/dev/null; then
            brew install openssl@3
          fi
          env -u MACOSX_DEPLOYMENT_TARGET make mvp2-deps

      - name: Prepare pinned Ladybug fixture CLI
        run: |
          directory="$RUNNER_TEMP/ladybug-0.22.3-cli"
          archive="$directory/lbug_cli-osx-arm64.tar.gz"
          mkdir -p "$directory"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/LadybugDB/ladybug/releases/download/v0.22.3/lbug_cli-osx-arm64.tar.gz
          printf '%s  %s\n' d0012ffc8683a7b88fe47b8068bf4ee12c5a7f5b5c08fde89a2e4a6acd091a90 "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$directory"
          test "$("$directory/lbug" -v)" = 'Lbug 0.22.3'
          printf 'LBUG=%s\n' "$directory/lbug" >> "$GITHUB_ENV"

      - name: Build pinned DuckDB native test runner
        run: |
          source="$RUNNER_TEMP/duckdb-v2.0.1-source"
          build="$RUNNER_TEMP/duckdb-v2.0.1-build"
          git -c advice.detachedHead=false clone --depth 1 --branch v2.0.1 \
            https://github.com/duckdb/duckdb.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = 8d78114e90a53823803660bf821f6073ac87da8c
          env -u MACOSX_DEPLOYMENT_TARGET cmake -S "$source" -B "$build" \
            -DCMAKE_BUILD_TYPE=Release -DDUCKDB_EXPLICIT_VERSION=v2.0.1 \
            -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= \
            -DBUILD_SHELL=OFF -DBUILD_UNITTESTS=ON \
            -DENABLE_UNITTEST_CPP_TESTS=OFF
          env -u MACOSX_DEPLOYMENT_TARGET cmake --build "$build" --target unittest --parallel 2
          test -x "$build/test/unittest"
          test -s "$build/src/libduckdb.dylib"
          printf 'DUCKDB_UNITTEST=%s\nDUCKDB_LIB=%s\n' \
            "$build/test/unittest" "$build/src/libduckdb.dylib" >> "$GITHUB_ENV"

      - name: Verify package profiles and native observations
        run: env -u MACOSX_DEPLOYMENT_TARGET make mvp2-stabilization-test

      - name: Save stabilization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quackweave-stabilization
          path: build/stabilization-reports/
          if-no-files-found: warn
