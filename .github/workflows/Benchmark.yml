name: Benchmark tracker
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: plan
        shell: bash
        run: |
          matrix=$(python3 benchmarks/provider_comparison/tracker/ci.py plan --manifest "$RUNNER_TEMP/commits.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: qw-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commits.json
          if-no-files-found: error
          retention-days: 30
      - run: python3 -B -m unittest discover -s benchmarks/provider_comparison/tracker -p 'test_ci.py'

  measure:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CC: clang
      CXX: clang++
      RUSTC_WRAPPER: ""
      COMMITS: ${{ matrix.commits }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      QW_RUNNER_CLASS: github-hosted/macos-15/arm64
      QW_REGRESSION_PERCENT: ${{ vars.QW_REGRESSION_PERCENT }}
      QW_REGRESSION_FLOOR_MS: ${{ vars.QW_REGRESSION_FLOOR_MS }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Record expected commits and load the latest history ref
        run: |
          read -ra revisions <<< "$COMMITS"
          python3 benchmarks/provider_comparison/tracker/ci.py init build/ci-evidence "${revisions[@]}"
          history=refs/heads/benchmark-history
          if git ls-remote --exit-code --heads origin "$history" >/dev/null; then
            git fetch --depth=1 --no-tags origin "$history:refs/remotes/origin/benchmark-history"
          else
            rc=$?; [[ $rc == 2 ]] || exit "$rc"
          fi
          test "$(uname -m)" = arm64
          {
            echo "QW_CPU=$(sysctl -n machdep.cpu.brand_string)"
            echo "QW_CORES=$(sysctl -n hw.logicalcpu)"
            echo "QW_MEMORY=$(sysctl -n hw.memsize)"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare pinned benchmark clients and native build inputs
        run: |
          echo "QW_BUILD_TOOLCHAIN=$(rustc --version) / $(clang --version | head -n 1)" >> "$GITHUB_ENV"
          python -m pip install --only-binary=:all: ladybug==0.22.3 pyarrow==23.0.1 numpy==2.2.6 adbc-driver-manager==1.9.0
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          env -u MACOSX_DEPLOYMENT_TARGET make mvp2-deps
      - uses: actions/cache@v4
        id: host
        with:
          path: build/benchmark-host
          key: benchmark-host-macos15-arm64-8d78114e-v1
      - name: Build pinned DuckDB ADBC library and SQLLogic runner
        if: steps.host.outputs.cache-hit != 'true'
        run: |
          source=build/deps/duckdb-8d78114e90a53823803660bf821f6073ac87da8c
          out="$RUNNER_TEMP/duckdb-build"
          env -u MACOSX_DEPLOYMENT_TARGET cmake -S "$source" -B "$out" -DCMAKE_BUILD_TYPE=Release -DCMAKE_BUILD_RPATH=@loader_path \
            -DDUCKDB_EXPLICIT_VERSION=v2.0.1 -DBUILD_SHELL=OFF -DBUILD_UNITTESTS=ON -DENABLE_UNITTEST_CPP_TESTS=OFF
          env -u MACOSX_DEPLOYMENT_TARGET cmake --build "$out" --target unittest --parallel 2
          mkdir -p build/benchmark-host
          cp "$out/test/unittest" "$out/src/libduckdb.dylib" build/benchmark-host/
      - name: Build direct RelateDB client and fixture loader
        run: |
          env -u MACOSX_DEPLOYMENT_TARGET cargo build --locked -p rusty_quack --target aarch64-apple-darwin \
            --release --features relate-provider --target-dir target/mvp2-relate --example relate_bench_read --example relate_bench_load
      - uses: actions/cache@v4
        id: fixture
        with:
          path: build/perf/provider-comparison/mod1
          key: benchmark-sf1-mod1-macos-arm64-${{ hashFiles('benchmarks/provider_comparison/prepare.py', 'crates/native/examples/relate_bench_load.rs', 'Cargo.lock') }}
      - name: Reproduce the full SF1 fixture on cache miss
        if: steps.fixture.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sf1.lbdb" \
            https://huggingface.co/datasets/ladybugdb/lsqb-sf1/resolve/8283a51fa16c4d9fbc3c53ebde66252f7a41f3f6/lbdb/sf1.lbdb
          python benchmarks/provider_comparison/prepare.py --modulus 1 --source "$RUNNER_TEMP/sf1.lbdb"
      - name: Measure, verify and compare each commit
        run: |
          fixture=build/perf/provider-comparison/mod1/edges.csv
          echo "4d7204dd0c29cfb2f058a6bb4f870dc5805f5aa77bff2a4e8e29a86ecfb7ba2b  $fixture" | shasum -a 256 --check
          export DUCKDB_LIB="$PWD/build/benchmark-host/libduckdb.dylib"
          export DUCKDB_UNITTEST="$PWD/build/benchmark-host/unittest"
          read -ra revisions <<< "$COMMITS"
          env -u MACOSX_DEPLOYMENT_TARGET bash benchmarks/provider_comparison/tracker/measure_ci.sh "${revisions[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qw-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.index }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Benchmark tracker gate
    if: always()
    needs: [plan, measure]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          MEASURE: ${{ needs.measure.result }}
        run: test "$PLAN" = success && test "$MEASURE" = success
