name: Prepare native CI build
description: Install the pinned native compiler toolchain and graph dependencies on macOS arm64
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.96.0"
        targets: aarch64-apple-darwin
    - shell: bash
      run: |
        test "$(uname -s):$(uname -m)" = Darwin:arm64
        brew list --versions openssl@3 >/dev/null || brew install openssl@3
        env -u MACOSX_DEPLOYMENT_TARGET make mvp2-deps
