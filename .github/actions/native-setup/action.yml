name: Prepare native CI build
description: Install the pinned native compiler toolchain and graph dependencies on ARM64
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.96.0"
    - shell: bash
      run: |
        case "$(uname -s):$(uname -m)" in
          Darwin:arm64)
            brew list --versions openssl@3 >/dev/null || brew install openssl@3
            echo 'QW_RUST_TARGET=aarch64-apple-darwin' >> "$GITHUB_ENV" ;;
          Linux:aarch64)
            command -v g++-13
            echo "CC=gcc-13" >> "$GITHUB_ENV"
            echo "CXX=g++-13" >> "$GITHUB_ENV"
            echo 'OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu' >> "$GITHUB_ENV"
            echo 'QW_RUST_TARGET=aarch64-unknown-linux-gnu' >> "$GITHUB_ENV" ;;
          *) exit 1 ;;
        esac
        env -u MACOSX_DEPLOYMENT_TARGET make native-deps
