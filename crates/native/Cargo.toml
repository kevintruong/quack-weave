[package]
name = "rusty_quack"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["relate-provider", "neo4j-provider"]
relate-provider = ["dep:relate", "dep:relate-parser"]
neo4j-provider = ["dep:base64", "dep:relate-parser", "dep:serde_json", "dep:ureq"]
neo4j-test-fixture = ["neo4j-provider"]
benchmark-engine-timing = []
template-compat = []

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = { version = "0.23", optional = true }
duckdb-neo.workspace = true
rusty_quack_core.workspace = true
relate = { version = "=1.2.0", optional = true }
relate-parser = { version = "=1.2.0", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
libc = "0.2"
serde_json = "1"

[[example]]
name = "relate_fixture"
path = "examples/relate_fixture.rs"
required-features = ["relate-provider"]

[[example]]
name = "relate_bench_load"
path = "examples/relate_bench_load.rs"
required-features = ["relate-provider"]

[[example]]
name = "relate_bench_read"
path = "examples/relate_bench_read.rs"
required-features = ["relate-provider"]
